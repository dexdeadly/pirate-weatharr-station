name: Create Release Zip

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from plugin.json
        id: version
        run: |
          VERSION=$(jq -r '.version // empty' plugin.json)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read .version from plugin.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.check.outputs.skip == 'false'
        run: |
          ZIP_NAME="pirate-weatharr-station-${{ steps.version.outputs.version }}.zip"
          # Wrap everything in one top-level folder named after the plugin
          # registry slug with dashes as underscores. Dispatcharr derives the
          # installed plugin key from this folder, and a registry update only
          # overwrites the install whose key matches the sanitized slug
          # ("pirate-weatharr-station" -> "pirate_weatharr_station"). Up to
          # v1.4.x this folder was "pws", so every registry update failed with
          # "Plugin 'pws' already exists" and users had to uninstall first.
          # (A flat zip would instead take its key from the zip filename,
          # which embeds the version and would change on every release.)
          PLUGIN_DIR=pirate_weatharr_station
          rm -rf /tmp/pws-release && mkdir -p "/tmp/pws-release/$PLUGIN_DIR"
          # Ship only what the plugin needs at runtime. These paths are also
          # gitignored; excluding them here keeps a stray re-add out of releases.
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='*.zip' \
            --exclude='.agents' --exclude='.codex' --exclude='.beads' \
            --exclude='.claude' --exclude='AGENTS.md' --exclude='CLAUDE.md' \
            --exclude='.gitignore' --exclude='__pycache__' \
            --exclude='tests' --exclude='requirements-dev.txt' \
            ./ "/tmp/pws-release/$PLUGIN_DIR/"
          (cd /tmp/pws-release && zip -rq "$OLDPWD/$ZIP_NAME" "$PLUGIN_DIR")
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Create tag and release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "$zip_name" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
