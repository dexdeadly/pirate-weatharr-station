name: Create Release Zip

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from plugin.json
        id: version
        run: |
          VERSION=$(jq -r '.version // empty' plugin.json)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read .version from plugin.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.check.outputs.skip == 'false'
        run: |
          ZIP_NAME="pirate-weatharr-station-${{ steps.version.outputs.version }}.zip"
          # Wrap everything in a top-level "pws" folder. Dispatcharr's plugin
          # installer names the installed directory (and plugin key) after
          # plugin.py's containing folder inside the zip, falling back to the
          # zip's own filename only when plugin.py sits at the zip root. That
          # fallback made the plugin key embed the version number and change
          # on every release, orphaning the previous install's settings,
          # channels and API key on every update.
          rm -rf /tmp/pws-release && mkdir -p /tmp/pws-release/pws
          rsync -a --exclude='.git' --exclude='.github' --exclude='*.zip' ./ /tmp/pws-release/pws/
          (cd /tmp/pws-release && zip -rq "$OLDPWD/$ZIP_NAME" pws)
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Create tag and release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "$zip_name" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
